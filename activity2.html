<!DOCTYPE html>
<html>
<head>
    <title>Simple JavaScript CRUD</title>
</head>

<body>

    <h1>Student CRUD System</h1>

    <input type="hidden" id="editIndex" value="-1">

    <label>Student ID:</label>
    <input type="text" id="studentId">
    <br>

    <label>Student Name:</label>
    <input type="text" id="studentName">
    <br>

    <label>Course:</label>
    <input type="text" id="studentCourse">
    <br>

    <input type="button" onclick="saveStudent()" value="Save Student">
    <button onclick="clearForm()">Cancel</button>

    <hr>

    <h2>Student Records</h2>

    <label>Search Student:</label>
    <input type="text" id="searchText">
    <button onclick="searchStudent()">Search</button>
    <button onclick="showAllStudents()">Show All</button>
    <button onclick="sortByName()">Sort by Name</button>

    <br><br>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Number</th>
                <th>Student ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>

    <p id="studentCount">Total Students: 0</p>

    <script>

        let students = [];

        function saveStudent() {

            let id = document.getElementById("studentId").value;
            let name = document.getElementById("studentName").value;
            let course = document.getElementById("studentCourse").value;
            let editIndex = parseInt(document.getElementById("editIndex").value);

            if (id === "" || name === "" || course === "") {
                alert("Please complete all fields.");
                return;
            }

            for (let index = 0; index < students.length; index++) {

                if (index !== editIndex && students[index].id === id) {
                    alert("Student ID already exists.");
                    return;
                }

                if (
                    index !== editIndex &&
                    students[index].name.toLowerCase() === name.toLowerCase()
                ) {
                    alert("Student name already exists.");
                    return;
                }
            }

            if (editIndex === -1) {

                let newStudent = {
                    id: id,
                    name: name,
                    course: course
                };

                students[students.length] = newStudent;

                alert("Student added successfully.");

            } else {

                students[editIndex].id = id;
                students[editIndex].name = name;
                students[editIndex].course = course;

                alert("Student updated successfully.");
            }

            clearForm();
            displayStudents();
        }

        function displayStudents() {

            let table = document.getElementById("studentTable");

            table.innerHTML = "";

            if (students.length === 0) {
                table.innerHTML =
                    "<tr>" +
                    "<td colspan='5'>No student records found.</td>" +
                    "</tr>";

                updateStudentCount();
                return;
            }

            for (let index = 0; index < students.length; index++) {

                table.innerHTML +=
                    "<tr>" +
                    "<td>" + (index + 1) + "</td>" +
                    "<td>" + students[index].id + "</td>" +
                    "<td>" + students[index].name + "</td>" +
                    "<td>" + students[index].course + "</td>" +
                    "<td>" +
                    "<button onclick='editStudent(" + index + ")'>Edit</button>" +
                    "<button onclick='deleteStudent(" + index + ")'>Delete</button>" +
                    "</td>" +
                    "</tr>";
            }

            updateStudentCount();
        }

        function editStudent(index) {

            document.getElementById("studentId").value =
                students[index].id;

            document.getElementById("studentName").value =
                students[index].name;

            document.getElementById("studentCourse").value =
                students[index].course;

            document.getElementById("editIndex").value = index;
        }

        function deleteStudent(index) {

            let answer = confirm(
                "Are you sure you want to delete this student?"
            );

            if (answer === false) {
                return;
            }

            for (
                let position = index;
                position < students.length - 1;
                position++
            ) {
                students[position] = students[position + 1];
            }

            students.length = students.length - 1;

            clearForm();
            displayStudents();

            alert("Student deleted successfully.");
        }

        function clearForm() {

            document.getElementById("studentId").value = "";
            document.getElementById("studentName").value = "";
            document.getElementById("studentCourse").value = "";
            document.getElementById("editIndex").value = "-1";
        }

        function searchStudent() {

            let searchText =
                document.getElementById("searchText").value.toLowerCase();

            let table = document.getElementById("studentTable");

            table.innerHTML = "";

            let found = false;
            let resultNumber = 1;

            for (let index = 0; index < students.length; index++) {

                let studentId = students[index].id.toLowerCase();
                let studentName = students[index].name.toLowerCase();

                if (
                    studentId === searchText ||
                    studentName === searchText
                ) {

                    table.innerHTML +=
                        "<tr>" +
                        "<td>" + resultNumber + "</td>" +
                        "<td>" + students[index].id + "</td>" +
                        "<td>" + students[index].name + "</td>" +
                        "<td>" + students[index].course + "</td>" +
                        "<td>" +
                        "<button onclick='editStudent(" + index + ")'>Edit</button>" +
                        "<button onclick='deleteStudent(" + index + ")'>Delete</button>" +
                        "</td>" +
                        "</tr>";

                    found = true;
                    resultNumber++;
                }
            }

            if (found === false) {
                table.innerHTML =
                    "<tr>" +
                    "<td colspan='5'>Student not found.</td>" +
                    "</tr>";
            }
        }

        function showAllStudents() {

            document.getElementById("searchText").value = "";
            displayStudents();
        }

        function sortByName() {

            for (let first = 0; first < students.length - 1; first++) {

                for (
                    let second = 0;
                    second < students.length - 1 - first;
                    second++
                ) {

                    if (
                        students[second].name.toLowerCase() >
                        students[second + 1].name.toLowerCase()
                    ) {

                        let temporary = students[second];
                        students[second] = students[second + 1];
                        students[second + 1] = temporary;
                    }
                }
            }

            displayStudents();
        }

        function updateStudentCount() {

            document.getElementById("studentCount").innerHTML =
                "Total Students: " + students.length;
        }

        displayStudents();

    </script>

</body>
</html>
